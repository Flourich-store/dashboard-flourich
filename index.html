  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-surface: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --primary: #059669;
      --primary-light: #ecfdf5;
    }

    html.theme-dark,
    html.dark-mode,
    :root.dark-mode,
    body.dark-mode {
      --bg-main: #070b16;
      --bg-surface: #0f1a2e;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --border-color: rgba(148, 163, 184, 0.16);
      --primary: #10b981;
      --primary-light: rgba(16, 185, 129, 0.14);
    }

    * { box-sizing: border-box; }
    html, body {
      background-color: var(--bg-main) !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden !important;
    }

    @media (max-width: 768px) {
      html, body {
        min-height: 100dvh !important;
        background-color: var(--bg-main) !important;
        overscroll-behavior-y: none !important;
        overscroll-behavior: none !important;
      }

      .spa-view,
      #landing-view,
      #dashboard-view,
      .dashboard-shell,
      #dashboard-frame {
        min-height: 100dvh !important;
        background-color: var(--bg-main) !important;
      }

      ::-webkit-scrollbar {
        width: 0px !important;
        height: 0px !important;
        display: none !important;
      }
    }

    body.is-dashboard {
      overflow: hidden !important;
    }

    .spa-view {
      display: none;
      min-height: 100vh;
      width: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background-color: var(--bg-main) !important;
    }

    .spa-view.active {
      display: block;
      animation: spa-enter .24s ease-out;
    }

    #landing-view {
      min-height: 100vh;
      background-color: var(--bg-main) !important;
      margin-bottom: 0 !important;
    }

    #landing-frame {
      width: 100%;
      height: 100vh;
      min-height: 760px;
      border: 0;
      display: block;
      overflow: hidden;
      background-color: var(--bg-main) !important;
      margin-bottom: 0 !important;
    }

    #dashboard-view {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: relative;
      background-color: var(--bg-main) !important;
      overflow: hidden;
      margin-bottom: 0 !important;
    }

    .dashboard-shell {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background-color: var(--bg-main) !important;
      overflow: hidden;
    }

    #dashboard-frame {
      width: 100%;
      height: 100vh !important;
      height: 100dvh !important;
      display: block;
      border: 0;
      border-radius: 0;
      background-color: var(--bg-main) !important;
      margin-bottom: 0 !important;
    }

    /* Sembunyikan bilah menu bawah outer secara permanen */
    .mobile-nav-bar {
      display: none !important;
    }

    @keyframes spa-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <section id="landing-view" class="spa-view active" aria-label="Landing page Flourich">
    <iframe id="landing-frame" title="Flourich landing page" src="landingpage.html"></iframe>
  </section>

  <section id="dashboard-view" class="spa-view" aria-label="Dashboard Flourich">
    <main class="dashboard-shell">
      <iframe id="dashboard-frame" title="Flourich Dashboard" src="about:blank" loading="lazy" allow="fullscreen"></iframe>
    </main>
  </section>

  <script>
    var DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbzG41th4MO9BH_wPJBx40-w8FB3QfBYwRfKvCOKt3IAEVMtWRGJ0R5BbHyQx-BAtQhjAw/exec?page=dashboard';
    var dashboardLoaded = false;

    // Inisialisasi tema awal dari localStorage
    try {
      var savedTheme = localStorage.getItem('dash_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('theme-dark', 'dark-mode');
        document.body.classList.add('dark-mode');
      }
    } catch (e) {}

    function updateViewState(updateHistory) {
      var showDashboard = window.location.hash === '#dashboard';
      document.getElementById('landing-view').classList.toggle('active', !showDashboard);
      document.getElementById('dashboard-view').classList.toggle('active', showDashboard);
      document.body.classList.toggle('is-dashboard', showDashboard);

      if (showDashboard && !dashboardLoaded) {
        document.getElementById('dashboard-frame').src = DASHBOARD_URL;
        dashboardLoaded = true;
      }
      if (updateHistory !== false) {
        history.pushState({ view: showDashboard ? 'dashboard' : 'landing' }, '', showDashboard ? '#dashboard' : '#beranda');
      }
      window.scrollTo(0, 0);
    }

    function switchView(view) {
      window.location.hash = view === 'dashboard' ? 'dashboard' : 'beranda';
    }

    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'flourich-theme') {
        var isDark = !!event.data.isDark;
        document.documentElement.classList.toggle('theme-dark', isDark);
        document.documentElement.classList.toggle('dark-mode', isDark);
        document.body.classList.toggle('dark-mode', isDark);
      }
      if (event.data && event.data.type === 'flourich-landing') {
        switchView('landing');
      }
      var landingFrame = document.getElementById('landing-frame');
      if (event.source === landingFrame.contentWindow && event.data && event.data.type === 'landing-height') {
        landingFrame.style.height = Math.max(window.innerHeight, Number(event.data.height) || 0) + 'px';
      }
      if (event.source === landingFrame.contentWindow && event.data && event.data.type === 'flourich-dashboard') {
        switchView('dashboard');
      }
    });
    window.addEventListener('load', function () { updateViewState(false); });
    window.addEventListener('hashchange', function () { updateViewState(false); });
    window.addEventListener('popstate', function () { updateViewState(false); });
    updateViewState(false);
  </script>
</body>
</html>
