<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flourich Dashboard dan landing page toko">
  <title>Flourich Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #f8fafc; }
    .spa-view { display: none; min-height: 100vh; }
    .spa-view.active { display: block; animation: spa-enter .24s ease-out; }
    #landing-view { min-height: 100vh; }
    #landing-frame { width: 100%; height: 100vh; min-height: 760px; border: 0; display: block; overflow: hidden; }
    #dashboard-view { min-height: 100vh; position: relative; }
    .dashboard-shell { min-height: 100vh; padding: 0; background: #f1f5f9; }
    #dashboard-frame { width: 100%; height: 760px; min-height: 760px; display: block; border: 0; border-radius: 0; background: #fff; overflow: hidden; }
    .floating-back { position: fixed; top: 16px; right: 24px; z-index: 10; border: 1px solid #cbd5e1; border-radius: 10px; background: rgba(255,255,255,.96); color: #334155; cursor: pointer; font: 700 13px Arial, sans-serif; padding: 11px 16px; box-shadow: 0 4px 16px rgba(15,23,42,.08); transition: opacity .2s, visibility .2s; }
    .floating-back.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .floating-back:hover { border-color: #34d399; color: #047857; }
    @keyframes spa-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 640px) { .floating-back { top: 10px; right: 10px; font-size: 11px; padding: 10px 11px; } #dashboard-frame { height: 900px; min-height: 900px; } }
  </style>
</head>
<body>
  <section id="landing-view" class="spa-view active" aria-label="Landing page Flourich">
    <iframe id="landing-frame" title="Flourich landing page" src="landingpage.html"></iframe>
  </section>

  <section id="dashboard-view" class="spa-view" aria-label="Dashboard Flourich">
    <button class="floating-back" type="button" onclick="switchView('landing')">&#8592; Kembali ke Landing Page</button>
    <main class="dashboard-shell">
      <iframe id="dashboard-frame" title="Flourich Dashboard" src="about:blank" loading="lazy" scrolling="no" allow="fullscreen"></iframe>
    </main>
  </section>

  <script>
    var DASHBOARD_URL = 'https://script.google.com/macros/s/AKfycbweVGh3stQEsi_HEOSNAQQqZMre802gz9ntXDkUDpLOkQBbEEqJiZqaHQDnTyxvPzKUVA/exec?page=dashboard';
    var dashboardLoaded = false;

    function switchView(view, updateHistory) {
      var showDashboard = view === 'dashboard';
      document.getElementById('landing-view').classList.toggle('active', !showDashboard);
      document.getElementById('dashboard-view').classList.toggle('active', showDashboard);
      if (showDashboard && !dashboardLoaded) {
        document.getElementById('dashboard-frame').src = DASHBOARD_URL;
        dashboardLoaded = true;
      }
      if (updateHistory !== false) {
        history.pushState({ view: showDashboard ? 'dashboard' : 'landing' }, '', showDashboard ? '#dashboard' : '#beranda');
      }
      window.scrollTo(0, 0);
    }

    window.addEventListener('message', function (event) {
      var landingFrame = document.getElementById('landing-frame');
      if (event.source === landingFrame.contentWindow && event.data && event.data.type === 'landing-height') {
        landingFrame.style.height = Math.max(window.innerHeight, Number(event.data.height) || 0) + 'px';
      }
      if (event.source === landingFrame.contentWindow && event.data && event.data.type === 'flourich-dashboard') {
        switchView('dashboard');
      }
      var dashboardFrame = document.getElementById('dashboard-frame');
      if (event.source === dashboardFrame.contentWindow && event.data && event.data.type === 'dashboard-height') {
        dashboardFrame.style.height = Math.max(760, Number(event.data.height) || 0) + 'px';
      }
      if (event.source === dashboardFrame.contentWindow && event.data && event.data.type === 'dashboard-state') {
        document.querySelector('.floating-back').classList.toggle('is-hidden', event.data.state === 'logged-in');
      }
    });
    window.addEventListener('popstate', function () { switchView(location.hash === '#dashboard' ? 'dashboard' : 'landing', false); });
    window.addEventListener('hashchange', function () { switchView(location.hash === '#dashboard' ? 'dashboard' : 'landing', false); });
    switchView(location.hash === '#dashboard' ? 'dashboard' : 'landing', false);
  </script>
</body>
</html>
